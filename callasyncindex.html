                        <!------- TIMER ------->

    <div class="container">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center">TIMER</h1>
                    <div class="text-center d-block">
                        <label for="countdown_input" class="d-block my-4 h1">Inserisci il Tempo in Secondi</label>
                        <input id="countdown_input" class="inputcustom my-3" type="text" min="1" max="3600">
                    </div>                        
                    <div class="text-center">
                        <button id="btnAvvio" class="btn btn-info mx-2 px-2">Avvio</button>
                        <button id="btnStop" class="btn btn-warning mx-2 px-2">Stop</button>
                        <button id="btnResetta" class="btn btn-success mx-2 px-2">Resetta</button>
                    </div>
                    <div>
                        <p class="text-center my-4 h2">Tempo Rimanente: <span id="temporestante" class="d-block h1">--</span></p>
                    </div>
            </div>
    </div>
